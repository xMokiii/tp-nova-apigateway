name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GATEWAY_TOKEN: ci-test-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r gateway/requirements.txt pytest
      - run: python -m pytest -q

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Generate token
        run: |
          TOKEN=$(openssl rand -hex 32)
          echo "::add-mask::$TOKEN"
          echo "GATEWAY_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - run: docker compose up --build -d --wait
      - run: sh scripts/integration-test.sh | tee sorties-endpoints.txt
      - if: failure()
        run: docker compose logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sorties-endpoints
          path: sorties-endpoints.txt
      - if: always()
        run: docker compose down

  build:
    runs-on: ubuntu-latest
    needs: integration
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          for service in users orders gateway; do
            docker build -t "$IMAGE/$service:$GITHUB_SHA" "./$service"
            docker push "$IMAGE/$service:$GITHUB_SHA"
          done
