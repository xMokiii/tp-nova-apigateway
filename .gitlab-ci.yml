stages:
  - test
  - build

test:
  stage: test
  image: python:3.12-slim
  variables:
    GATEWAY_TOKEN: ci-test-token
  script:
    - pip install --no-cache-dir -r gateway/requirements.txt pytest
    - python -m pytest -q

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      for service in users orders gateway; do
        docker build -t "$CI_REGISTRY_IMAGE/$service:$CI_COMMIT_SHA" "./$service"
        docker push "$CI_REGISTRY_IMAGE/$service:$CI_COMMIT_SHA"
      done
